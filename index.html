<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Short games about how everyday choices show up in your blood sugar.">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Steady Day</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Averia+Serif+Libre:wght@400;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap">
<style>
/* Layout: one centered column, a "day" with a live glucose chart on top and the current moment below. */
/* Clean playful UI: white page, soft-gray cards, near-black tight Inter headlines, DM Sans for reading,
   flat pastel character panels (periwinkle, lemon, plum, coral, orange). Light-only by choice. */
:root{
  --bg:#ffffff; --surface:#f2f5f9; --ink:#13294b; --muted:#4a5a72; --line:#dbe3ee;
  --trust:#1f5fae; --trust-soft:#e3eefb; --teal:#0f766e; --teal-soft:#dff2ee;
  --leaf:#1f6b4f; --leaf-ink:#ffffff; --leaf-soft:#ddf1e6; --high:#9a4410; --high-soft:#fbe3cf; --low:#9e2340; --low-soft:#f8d9df;
  --butter:#ece98a; --lavender:#ddd2f5; --sky:#c9cff5;
  /* illustration inks */
  --pot:#f7863f; --pot-dark:#e06c25; --petal:#f6b2b2; --sun:#e8e070; --stem:#3f8a3f; --leaf2:#9fd08a; --soil:#e6d9c6; --drop:#8f9be6; --lav-ink:#b59de0;
  --dawn:#fde6c6; --skyday:#cfe5f6; --dusk:#e3d6f4; --night:#a9aee0; --grass1:#c3e5a8; --grass2:#99d07f; --grass3:#6fae5b;
  --carrot:#f7863f; --peri:#c9cff5; --lemon:#ece98a; --plum:#9d89c4; --coral:#f08a8a; --orange:#f7863f; --pill:#e4ebf4;
  color-scheme:light;
  --display:"DM Sans", "Segoe UI", system-ui, sans-serif;
  --mono:"DM Sans", "Segoe UI", system-ui, sans-serif;
  --body:"DM Sans", "Segoe UI", system-ui, sans-serif;
  --serif:"Averia Serif Libre", Georgia, "Times New Roman", serif;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:18px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
main{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:32px}
h1{font-family:var(--display)}
h2,h3{font-family:var(--body);font-weight:700}
h1,h2,h3{text-wrap:balance;margin:0;line-height:1.1}
h1{font-size:clamp(2rem,8vw,3.2rem);font-weight:800;letter-spacing:-.05em}
h2{font-size:1.3rem;font-weight:700;letter-spacing:-.03em;line-height:1.25}
h3{font-size:1.1rem;font-weight:600}
p{margin:0}
.muted{color:var(--muted)}
.eyebrow{font-size:.88rem;text-transform:uppercase;letter-spacing:.09em;font-weight:700;color:var(--leaf)}
.panel{background:none;border:0;padding:0;display:flex;flex-direction:column;gap:12px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.choice{background:var(--surface);border:2px solid transparent;border-radius:16px;padding:16px 18px;min-height:60px;font-size:1.05rem;line-height:1.4;text-align:left;display:flex;gap:12px;align-items:flex-start;transition:border-color .15s,transform .15s}
.choice:hover{border-color:var(--ink);background:var(--surface);transform:translateY(-1px)}
.choice .key{font-family:var(--display);font-weight:800;color:var(--ink);min-width:1.3em;font-size:1.1rem}
.choices{display:flex;flex-direction:column;gap:10px}
.btn{background:var(--ink);color:var(--butter);font-family:var(--mono);letter-spacing:.02em;border:0;border-radius:999px;padding:14px 28px;min-height:52px;font-size:1.05rem;font-weight:700;align-self:flex-start}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.hud{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center}
.stat{display:flex;flex-direction:column;gap:2px}
.stat b{font-family:var(--display);font-size:1.4rem;font-variant-numeric:tabular-nums}
.stat span{font-size:.88rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.pips{display:flex;gap:4px}
.pip{width:18px;height:10px;border-radius:999px;background:var(--line)}
.pip.on{background:var(--high)}
.pip.on.hot{background:var(--low)}
.chart{overflow-x:auto}
.chart svg{display:block;width:100%;height:auto}
.tag{display:inline-block;font-size:.9rem;font-weight:700;padding:4px 12px;border-radius:999px}
.tag.good{background:var(--leaf-soft);color:var(--leaf)}
.tag.warn{background:var(--high-soft);color:var(--high)}
.tag.bad{background:var(--low-soft);color:var(--low)}
.delta{font-variant-numeric:tabular-nums;font-weight:700}
.explain{border-left:3px solid var(--high);padding-left:12px;font-size:.95rem;color:var(--muted)}
.paths{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.badges{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.badge{border:1.5px dashed var(--line);border-radius:16px;background:var(--surface);padding:12px;display:flex;flex-direction:column;gap:4px;color:var(--muted)}
.badge.got{border-style:solid;border-color:var(--leaf);color:var(--ink);background:var(--leaf-soft)}
.badge b{font-family:var(--display)}
label{font-weight:700;font-size:.9rem}
input,select{font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;width:100%;min-height:52px;border-width:2px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form .full{grid-column:1/-1}
.form > div{display:flex;flex-direction:column;gap:6px;min-width:0}
@media (max-width:480px){.form{grid-template-columns:1fr}}
.goal{font-family:var(--display);font-size:1.25rem;font-weight:600;line-height:1.3}
.fine{font-size:.95rem;color:var(--muted);line-height:1.5}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.hud-wrap{display:flex;flex-direction:column;align-items:center;gap:12px}
.hud-wrap .hud{width:100%;justify-content:center;column-gap:32px;row-gap:12px}
.hud .stat{align-items:center;text-align:center}
.buddy{display:flex;flex-direction:column;align-items:center;gap:2px}
.buddy svg{width:96px;height:auto;display:block}
@keyframes pop{0%{transform:scale(.9)}60%{transform:scale(1.06)}100%{transform:scale(1)}}
.buddy .say{font-size:.95rem;font-weight:700;text-align:center;color:var(--muted);line-height:1.2}
.sprout .sway{transform-box:view-box;transform-origin:60px 90px;animation:sway 3.6s ease-in-out infinite}
.sprout .still{animation:none}
@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
.scene{display:flex;gap:14px;align-items:center}
.scene .icon{width:64px;height:64px;flex:0 0 auto}
.scene > div{display:flex;flex-direction:column;gap:6px;min-width:0}
.illo > svg{display:block;width:100%;height:auto}
/* intro */
.ih > svg{display:block;width:100%;height:auto;border-radius:16px}
.ih .hk{animation-duration:10.5s;animation-iteration-count:infinite;animation-timing-function:ease-out;animation-fill-mode:both;transform-box:fill-box;transform-origin:center}
.ih-cap{display:flex;align-items:center;gap:12px;min-height:84px}
.ih-bud{flex:0 0 auto}
.ih-bud svg{width:72px;height:auto;display:block}
.ih-cap p{font-family:var(--body);font-weight:700;font-size:1.2rem;line-height:1.35;min-width:0}
.steps{margin:0;padding:0;list-style:none;display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;counter-reset:s}
.steps li{display:flex;flex-direction:column;gap:4px;background:var(--bg);border-radius:16px;padding:14px;counter-increment:s}
.steps li::before{content:counter(s);font-family:var(--display);font-weight:800;color:var(--leaf);font-size:1.4rem;line-height:1}
.day{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.day li{display:flex;align-items:center;gap:12px}
.day .icon{width:44px;height:44px;flex:0 0 auto}
.day li > div{display:flex;flex-direction:column;gap:3px;min-width:0;align-items:flex-start}
.link{background:none;border:0;padding:10px 0;min-height:48px;display:inline-flex;align-items:center;color:var(--ink);font-weight:700;font-size:1rem;align-self:flex-start;text-decoration:underline;text-underline-offset:4px}
.cta{display:flex;flex-direction:column;gap:8px;align-items:center;text-align:center}
.cta .btn{align-self:center}
.eyebrow,.tag,.stat span,.link{font-family:var(--mono)}
.eyebrow{color:var(--ink)}
/* poster hero */
.poster{width:100%;max-width:460px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.p-top{display:flex;justify-content:space-between;gap:12px;font-family:var(--mono);font-size:1rem;line-height:1.4}
.p-top span:last-child{text-align:right}
.p-art{position:relative;width:100%;aspect-ratio:400/420;container-type:inline-size}
.p-art > svg{position:absolute;inset:0;width:100%;height:100%}
.p-back{z-index:0}.p-front{z-index:2;pointer-events:none}
.p-title{position:absolute;inset:0;z-index:1;margin:0;font-family:var(--display);font-weight:800;letter-spacing:-.06em;line-height:.9;font-size:5rem;font-size:23cqw;white-space:nowrap;color:var(--ink)}
.p-title span{position:absolute}
.p-title .l1{left:-1%;top:17%}
.p-title .l2{right:0;top:57%}
.p-cap{font-family:var(--mono);font-size:1.05rem;line-height:1.55;max-width:32ch}
.rule{border:0;border-top:1.5px solid var(--ink);margin:0;width:100%}
.foot{display:flex;justify-content:space-between;gap:12px;font-family:var(--mono);font-size:.95rem;padding-top:12px;flex-wrap:wrap;border-top:1.5px solid var(--ink)}
.fade{animation:fade .3s ease}
@keyframes fade{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}
/* ---- clean playful overrides ---- */
h1{font-family:var(--display);font-weight:600;letter-spacing:-.045em;line-height:1}
h2,h3{font-family:var(--display);font-weight:600;letter-spacing:-.025em}
.panel{background:var(--surface);border-radius:24px;padding:20px}
.choice{background:var(--bg);border:2px solid transparent;border-radius:18px}
.choice:hover{border-color:var(--ink);background:var(--bg)}
.btn{background:var(--ink);color:#fff;font-family:var(--display);font-weight:600;letter-spacing:-.01em;border-radius:12px}
.btn.ghost{background:var(--surface);color:var(--ink);border:0}
.tag{background:var(--pill);color:var(--ink);font-family:var(--display);font-weight:500;letter-spacing:0}
.eyebrow{font-family:var(--display);text-transform:none;letter-spacing:0;font-weight:600;color:var(--muted);font-size:.95rem}
.stat span{font-family:var(--display);text-transform:none;letter-spacing:0;font-weight:500;font-size:.92rem}
.stat b{font-family:var(--display);font-weight:600;letter-spacing:-.02em}
.choice .key{font-family:var(--display);font-weight:600}
.badge{background:var(--bg);border-radius:18px}
input,select{background:var(--bg)}
.explain{border-left-color:var(--orange)}
/* intro */
.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--display);font-weight:600;font-size:1.05rem;letter-spacing:-.02em}
.brand svg{width:26px;height:26px}
.pillbtn{display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--line);border-radius:12px;padding:10px 14px;font-family:var(--display);font-weight:600;font-size:.92rem}
.pillbtn svg{width:16px;height:16px}
.hero2{display:flex;flex-direction:column;gap:18px;align-items:center;text-align:center}
.hero2 .btn{align-self:center}
.anim .ih-cap{justify-content:center}
.hero2 h1{font-size:clamp(2.9rem,12vw,4.4rem)}
.lead{font-size:1.1rem;line-height:1.55;color:var(--muted);max-width:40ch}
.anim{display:flex;flex-direction:column;gap:12px}
/* path cards */
.pcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.pcard{display:flex;flex-direction:column;background:var(--surface);border:2px solid transparent;border-radius:24px;padding:0;text-align:left;overflow:hidden;transition:border-color .15s,transform .15s}
.pcard:hover{border-color:var(--ink);transform:translateY(-2px)}
.pc-top{position:relative;display:flex;flex-direction:column;gap:8px;padding:16px 16px 18px;min-width:0}
.pc-top .tag{align-self:flex-start;font-size:.82rem;margin-right:32px}
.pc-top .arr{position:absolute;top:14px;right:14px;width:28px;height:28px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font-size:.9rem}
.pc-top h3{font-size:1.3rem;line-height:1.1}
.pc-top p{font-size:.95rem;color:var(--muted);line-height:1.4}
.pc-art{margin-top:auto;border-radius:20px;overflow:hidden;aspect-ratio:4/3}
.pc-art svg{display:block;width:100%;height:100%}
/* build a plate */
.plate-wrap{align-items:center}
.plate-svg{width:100%;max-width:360px;display:block}
.zone{cursor:pointer}.zone:focus{outline:none}.zone:focus-visible .zfill{stroke:var(--ink);stroke-width:5}
.placed{pointer-events:none}
.drinkbtn{display:flex;align-items:center;gap:12px;background:var(--bg);border:2px dashed var(--line);border-radius:18px;padding:8px 18px 8px 10px;min-height:72px;text-align:left}
.drinkbtn svg{width:52px;height:52px}
.drinkbtn.hot{border-color:var(--ink)}
.pmsg{min-height:3.2em;text-align:center;font-weight:500;max-width:36ch}
.pmsg .bad{color:var(--low);font-weight:700}.pmsg .good{color:var(--leaf);font-weight:700}
.tray{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px}
.food{background:var(--surface);border:2px solid transparent;border-radius:18px;padding:10px 6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:108px;font-size:.95rem;font-weight:600;line-height:1.2;text-align:center}
.food svg{width:54px;height:54px}
.food:hover{border-color:var(--line)}
.food[aria-pressed="true"]{border-color:var(--ink);background:var(--leaf-soft)}
.food:disabled{opacity:.3;cursor:default}
.meter{position:relative;height:14px;border-radius:7px;background:var(--bg)}
.meter-fill{position:absolute;left:0;top:0;bottom:0;border-radius:7px;background:var(--leaf)}
.meter-fill.hi{background:var(--high)}
.meter-tgt{position:absolute;top:-5px;bottom:-5px;width:3px;border-radius:2px;background:var(--ink)}
.swaps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.swaps li{display:flex;align-items:center;gap:12px}
.swaps li svg{width:44px;height:44px;flex:0 0 auto}
.swaps li > div{display:flex;flex-direction:column;gap:2px;min-width:0}
.hands{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.hands li{background:var(--bg);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:2px}
.tips{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px}
/* home preview */
.pv{position:relative;background:var(--leaf-soft);border-radius:24px;padding:26px 26px 0;overflow:hidden}
.pv-win{position:relative;background:#fff;border-radius:18px 18px 0 0;height:clamp(270px,74vw,330px);box-shadow:0 0 0 1px rgba(20,20,20,.05)}
.pv-scene{position:absolute;inset:16px 16px 0;display:flex;flex-direction:column;gap:12px;opacity:0;transition:opacity .6s ease}
.pv-scene.on{opacity:1}
.sk-row{display:flex;gap:12px;align-items:center}
.sk-col{display:flex;flex-direction:column;gap:8px;flex:1}
.sk-bar{display:block;height:9px;border-radius:5px;background:#dde5ef}
.pq-ic svg{width:44px;height:44px;display:block}
.pq-bud{width:44px;flex:0 0 auto;opacity:0;transform:scale(.6);transition:opacity .3s ease,transform .35s cubic-bezier(.3,1.6,.5,1)}
.pq-bud.show{opacity:1;transform:none}
.pq-bud svg{width:44px;height:auto;display:block}
.pq-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pq-tile{display:flex;flex-direction:column;gap:8px;padding:10px;border-radius:14px;background:var(--surface);border:2px solid transparent;transition:border-color .25s,background .25s}
.pq-badge{display:grid;place-items:center;width:46px;height:46px;border-radius:50%;background:#fff}
.pq-badge svg{width:34px;height:34px}
.pq-lines{display:flex;flex-direction:column;gap:6px}
.pq-tile.on{border-color:var(--leaf);background:var(--leaf-soft)}
.pv-scene.b{flex-direction:row;align-items:flex-start;gap:14px;padding-top:4px}
.pp-plate{width:50%;max-width:200px;flex:0 0 auto;display:block}
.pp-plate .wz{fill:#f1f1ee;stroke:#fff;stroke-width:2;transition:fill .3s ease}
.pp-plate .wz[data-z="veg"].on{fill:#e2f1d8}.pp-plate .wz[data-z="protein"].on{fill:#fbe3cf}.pp-plate .wz[data-z="carb"].on{fill:#f6f0c8}
.pp-on{opacity:0;transition:opacity .3s ease}
.pp-on.show{opacity:1}
.pp-tray{flex:1;display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.pp-tile{display:grid;place-items:center;aspect-ratio:1.1;border-radius:12px;background:var(--surface);transition:opacity .4s ease}
.pp-tile svg{width:70%;height:70%}
.pp-tile.used{opacity:.3}
.pv-cursor{position:absolute;left:0;top:0;z-index:3;pointer-events:none;will-change:transform;transform:translate(84%,86%)}
.pv-cursor .arrow{width:32px;height:32px;display:block;transition:transform .15s ease;transform-origin:5px 3px}
.pv-cursor.click .arrow{transform:scale(.82)}
.pv-label{position:absolute;right:20px;bottom:34px;display:inline-flex;align-items:center;gap:8px;white-space:nowrap;background:#fff;color:var(--ink);font-family:var(--display);font-weight:600;font-size:.92rem;padding:7px 14px 7px 10px;border-radius:999px;box-shadow:0 2px 10px rgba(20,20,20,.12)}
.pv-dot{width:10px;height:10px;border-radius:50%;background:var(--orange)}
/* game header: Sprout outside the card, stats in three even columns */
.buddy-hero{display:flex;flex-direction:column;align-items:center;gap:2px;margin-bottom:-8px}
.buddy-hero svg{width:clamp(120px,36vw,156px);height:auto;display:block}
.buddy-hero .say{font-family:var(--display);font-weight:600;font-size:1.1rem;letter-spacing:-.01em;text-align:center}
.hudp{gap:16px}
.hud3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;align-items:start}
.hud3 .stat{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;min-width:0}
.hud3 .stat > span:first-child{font-size:.9rem;color:var(--muted)}
.hud3 .stat b{font-size:1.4rem;line-height:28px}
.hud3 .stat .tag{font-size:.92rem;line-height:20px;white-space:nowrap}
.hud3 .stat small{font-size:.85rem;color:var(--muted)}
.hud3 .pips{height:28px;align-items:center}
.hud3 .pip{width:14px}
/* blood sugar gauge + day track */
.hp-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.hp-head span:first-child{font-family:var(--display);font-weight:600;font-size:1.1rem;letter-spacing:-.01em}
.hp-now{font-size:.92rem;color:var(--muted)}
.hp-label{display:block;font-size:.9rem;color:var(--muted);margin-bottom:8px}
.hp-sec{padding-top:14px;border-top:1px solid var(--line)}
.hp-two{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding-top:14px;border-top:1px solid var(--line)}
.hp-val{display:flex;align-items:center;gap:10px;min-height:32px}
.hp-val b{font-family:var(--display);font-weight:600}
.hp-val b.big{font-size:1.5rem;letter-spacing:-.02em}
.gauge{display:flex;flex-direction:column;gap:8px}
.g-pill-row{position:relative;height:34px}
.g-pill{position:absolute;bottom:4px;transform:translateX(-50%);padding:4px 14px;border-radius:999px;color:#fff;font-family:var(--display);font-weight:700;font-size:1rem;transition:left .9s cubic-bezier(.4,0,.2,1)}
.g-pill::after{content:"";position:absolute;left:50%;bottom:-5px;margin-left:-5px;border:5px solid transparent;border-bottom:0;border-top-color:inherit}
.g-pill.good{background:var(--leaf);border-top-color:var(--leaf)}.g-pill.warn{background:var(--high);border-top-color:var(--high)}.g-pill.bad{background:var(--low);border-top-color:var(--low)}

// Mood: blood sugar out of range wins; otherwise react to the last choice, then to stress.
function sproutMood(g){
  if(g>HI) return 'warn';
  if(g<LO) return 'bad';
  if(S.fb&&S.fb.c) return S.fb.c.ok?'cheer':'sad';
  if(S.stress>=3) return 'stress';
  return 'good';
}

// Compact chart: zone names sit in their own right-hand column so they never touch the line or labels.
function chart(vals){
  const W=320,H=176,pl=8,pr=56,pt=30,pb=26,max=260,min=26;
  const y=v=>pt+(max-Math.min(max,Math.max(min,v)))/(max-min)*(H-pt-pb);
  const x=i=>pl+14+i*(W-pl-pr-26)/(TIMES.length-1);
  const uid='c'+Math.random().toString(36).slice(2,7);
  const span=H-pb-pt, f1=((y(HI)-pt)/span).toFixed(3), f2=((y(LO)-pt)/span).toFixed(3);
  const col=v=>v<LO?'var(--low)':v>HI?'var(--high)':'var(--leaf)';
  const last=vals.length-1, lv=vals[last], lx=W-pr+12;
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Blood sugar across the day, now ${zoneText(lv).toLowerCase()} at ${lv}" font-family="var(--body)">
   <defs>
    <linearGradient id="${uid}l" gradientUnits="userSpaceOnUse" x1="0" y1="${pt}" x2="0" y2="${H-pb}">
     <stop offset="0" stop-color="var(--high)"/><stop offset="${f1}" stop-color="var(--high)"/><stop offset="${f1}" stop-color="var(--leaf)"/>
     <stop offset="${f2}" stop-color="var(--leaf)"/><stop offset="${f2}" stop-color="var(--low)"/><stop offset="1" stop-color="var(--low)"/></linearGradient>
    <linearGradient id="${uid}a" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--leaf)" stop-opacity=".16"/><stop offset="1" stop-color="var(--leaf)" stop-opacity="0"/></linearGradient>
   </defs>`;
  // steady band across the plot, and a quiet baseline
  s+=`<rect x="${pl}" y="${y(HI)}" width="${W-pl-pr}" height="${y(LO)-y(HI)}" rx="10" fill="var(--leaf-soft)"/>`;
  s+=`<path d="M${pl} ${H-pb} H${W-pr}" stroke="var(--line)" stroke-width="1.5"/>`;
  // zone names, evenly placed in the right column
  s+=`<text x="${lx}" y="${(pt+y(HI))/2+4}" font-size="13" font-weight="700" fill="var(--high)">High</text>`;
  s+=`<text x="${lx}" y="${(y(HI)+y(LO))/2+4}" font-size="13" font-weight="700" fill="var(--leaf)">Steady</text>`;
  s+=`<text x="${lx}" y="${(y(LO)+H-pb)/2+4}" font-size="13" font-weight="700" fill="var(--low)">Low</text>`;
  // time labels: start, now, end
  TIMES.forEach((t,i)=>{const now=i===last;
    if(now||i===0||i===TIMES.length-1){const anchor=i===0?'start':i===TIMES.length-1?'end':'middle', tx=i===0?x(i)-10:i===TIMES.length-1?x(i)+10:x(i);
      s+=`<text x="${tx}" y="${H-7}" text-anchor="${anchor}" font-size="13" font-weight="${now?700:400}" fill="var(${now?'--leaf':'--muted'})">${t}</text>`}
    if(i>last) s+=`<circle cx="${x(i)}" cy="${(y(HI)+y(LO))/2}" r="2.6" fill="var(--muted)" opacity=".35"/>`;});
  if(vals.length>1){
    let d=`M${x(0)} ${y(vals[0])}`;
    for(let i=1;i<vals.length;i++){const mx=(x(i-1)+x(i))/2;d+=` C${mx} ${y(vals[i-1])} ${mx} ${y(vals[i])} ${x(i)} ${y(vals[i])}`}
    s+=`<path d="${d} L${x(last)} ${H-pb} L${x(0)} ${H-pb} Z" fill="url(#${uid}a)"/>`;
    s+=`<path d="${d}" fill="none" stroke="url(#${uid}l)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>`;
  }
  vals.slice(0,last).forEach((v,i)=>{s+=`<circle cx="${x(i)}" cy="${y(v)}" r="3.5" fill="#fff" stroke="${col(v)}" stroke-width="2.5"/>`});
  const cx=x(last), cy=y(lv), c=col(lv);
  s+=`<circle cx="${cx}" cy="${cy}" r="11" fill="${c}" opacity=".16"/><circle cx="${cx}" cy="${cy}" r="6" fill="${c}" stroke="#fff" stroke-width="2.5"/>`;
  // value pill above the point (below it if there's no room), kept inside the plot
  const pw=46, ph=22, px=Math.min(Math.max(cx-pw/2,pl),W-pr-pw), above=cy-ph-12>=2, py=above?cy-ph-12:cy+12;
  s+=`<rect x="${px}" y="${py}" width="${pw}" height="${ph}" rx="11" fill="${c}"/><text x="${px+pw/2}" y="${py+15.5}" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff">${lv}</text>`;
  return s+'</svg>';
}

let heroRAF=0, heroGame='plate', heroAuto=true;
// Preview loop for ONE game at a time. The cursor follows a smooth closed curve, taps as it passes,
// and the screen softly fades and resets at the end of each loop.
function playHero(){
  const pv=document.querySelector('.pv'); if(!pv) return;
  const cur=pv.querySelector('.pv-cursor'), name=pv.querySelector('.pv-name');
  const A=pv.querySelector('.pv-scene.a'), B=pv.querySelector('.pv-scene.b');
  const qt=A.querySelectorAll('.pq-tile'), bud=A.querySelector('.pq-bud');
  const tile=k=>B.querySelector(`.pp-tile[data-k="${k}"]`), on=k=>B.querySelector(`.pp-on[data-k="${k}"]`), wz=z=>B.querySelector(`.wz[data-z="${z}"]`);
  const place=(k,z)=>{tile(k).classList.add('used');on(k).classList.add('show');wz(z).classList.add('on')};
  const clear=()=>{pv.querySelectorAll('.pq-tile.on,.pq-bud.show,.used,.pp-on.show,.wz.on').forEach(e=>e.classList.remove('on','show','used'))};
  const C=pv.querySelector('.pv-scene.c'), prn=C.querySelector('#prnum'), prt=k=>C.querySelector(`.pr-tile[data-k="${k}"]`);
  const coping=heroGame==='coping', r15=heroGame==='r15', scene=r15?C:coping?A:B;
  pv.dataset.g=heroGame; A.classList.toggle('on',coping&&!r15); B.classList.toggle('on',heroGame==='plate'); C.classList.toggle('on',r15);
  name.textContent=r15?'Rule of 15':coping?'A stressful day':'Build a plate';
  const clearC=()=>{C.querySelectorAll('.pr-tile.on').forEach(e=>e.classList.remove('on'));prn.textContent='62';prn.classList.remove('ok')};
  clear(); clearC();
  const rise=()=>{let v=62;const iv=setInterval(()=>{v+=2;prn.textContent=Math.min(v,96);if(v>=70)prn.classList.add('ok');if(v>=96)clearInterval(iv)},45);heroTimers.push(iv)};
  if(matchMedia('(prefers-reduced-motion: reduce)').matches){
    if(r15){prt('juice').classList.add('on');prn.textContent='96';prn.classList.add('ok')}else if(coping){qt[1].classList.add('on');bud.classList.add('show')}else{place('carrot','veg');place('chicken','protein');place('rice','carb')}
    cur.style.transform='translate(70%,70%)';return}
  const at=(el,fx=.55,fy=.5)=>()=>{const r=el.getBoundingClientRect(),p=pv.getBoundingClientRect();return [r.left-p.left+r.width*fx, r.top-p.top+r.height*fy]};
  const rel=(fx,fy)=>()=>{const p=pv.getBoundingClientRect();return [p.width*fx,p.height*fy]};
  const tap=fn=>{cur.classList.add('click');fn();heroTimers.push(setTimeout(()=>cur.classList.remove('click'),170))};
  const fadeReset=()=>{scene.classList.remove('on');heroTimers.push(setTimeout(()=>{clear();clearC();scene.classList.add('on')},600))};
  const L=r15?6.4:coping?5.6:7.2;
  const stops=r15?[[0,rel(.84,.84)],[1.5,at(prt('juice'))],[3.0,rel(.7,.6)],[4.6,rel(.78,.76)]]:coping
    ?[[0,rel(.84,.84)],[1.5,at(qt[1])],[3.0,rel(.66,.62)],[4.3,rel(.76,.76)]]
    :[[0,rel(.84,.84)],[1.3,at(tile('carrot'))],[2.6,at(tile('chicken'))],[3.9,at(tile('rice'))],[5.2,rel(.7,.62)],[6.3,rel(.78,.76)]];
  const events=r15?[[1.5,()=>tap(()=>{prt('juice').classList.add('on');rise()})],[5.4,fadeReset]]:coping
    ?[[1.5,()=>tap(()=>{qt[1].classList.add('on');bud.classList.add('show')})],[4.6,fadeReset]]
    :[[1.3,()=>tap(()=>place('carrot','veg'))],[2.6,()=>tap(()=>place('chicken','protein'))],[3.9,()=>tap(()=>place('rice','carb'))],[6.2,fadeReset]];
  let pts=stops.map(s=>s[1]()), t0=performance.now(), lastT=0, loops=0;
  const onResize=()=>{pts=stops.map(s=>s[1]())}; window.addEventListener('resize',onResize);
  const n=stops.length, cr=(p0,p1,p2,p3,u)=>{const u2=u*u,u3=u2*u;return [0,1].map(k=>.5*(2*p1[k]+(-p0[k]+p2[k])*u+(2*p0[k]-5*p1[k]+4*p2[k]-p3[k])*u2+(-p0[k]+3*p1[k]-3*p2[k]+p3[k])*u3))};
  const frame=now=>{
    if(!document.body.contains(pv)){window.removeEventListener('resize',onResize);return}
    const t=((now-t0)/1000)%L;
    if(t<lastT){loops++;pts=stops.map(s=>s[1]());
      if(heroAuto&&loops>=2){window.removeEventListener('resize',onResize);setHeroGame({coping:'plate',plate:'r15',r15:'coping'}[heroGame],false);return}}
    events.forEach(([et,fn])=>{if((lastT<et&&t>=et)||(t<lastT&&t>=et)) fn()});
    lastT=t;
    let i=n-1; for(let k=0;k<n;k++){const a=stops[k][0], b=k+1<n?stops[k+1][0]:L; if(t>=a&&t<b){i=k;break}}
    const a=stops[i][0], b=i+1<n?stops[i+1][0]:L, u=(t-a)/(b-a);
    const [x,y]=cr(pts[(i-1+n)%n],pts[i],pts[(i+1)%n],pts[(i+2)%n],u);
    cur.style.transform=`translate(${x.toFixed(1)}px,${y.toFixed(1)}px)`;
    heroRAF=requestAnimationFrame(frame);
  };
  heroRAF=requestAnimationFrame(frame);
}

// Blood sugar shown two ways that never overlap:
// 1) a gauge bar with Low / Steady / High segments and a marker for right now
// 2) a day track: one icon per moment, ringed in the color of its zone
const GLO=40, GHI=260, gpct=v=>(Math.min(GHI,Math.max(GLO,v))-GLO)/(GHI-GLO)*100;
const DAY_ICONS=['sunrise','coffee','laptop','plate','bill','pan','moon'];
function gauge(g,from){

  return `<div class="gauge" role="img" aria-label="Blood sugar ${g} mg/dL, ${zoneText(g).toLowerCase()}. The steady zone is 70 to 180.">
    <div class="g-pill-row"><span class="g-pill ${zone(g)}" data-to="${pill(to)}%" style="left:${pill(fr)}%">${g}</span></div>
    <div class="g-track"><span class="g-seg low" style="width:${p1}%"></span><span class="g-seg ok" style="width:${p2-p1}%"></span><span class="g-seg hi" style="width:${100-p2}%"></span>
      <span class="g-mark" data-to="${to}%" style="left:${fr}%"></span></div>
    <div class="g-labels"><span class="low" style="width:${p1}%">Low</span><span class="ok" style="width:${p2-p1}%">Steady</span><span class="hi" style="width:${100-p2}%">High</span></div>

function dayTrack(vals,showValues){

      <span class="dt-i ${st} ${i===last&&!showValues?'now':''}">${icon(n)}</span>
      ${showValues?`<span class="dt-v ${st}">${v??''}</span>`:''}</div>`}).join('')}</div>`;
}

function choose(m,k){
  const c=m.choices[k], mult=PATHS[S.path].mult;
  const before=S.gl[S.gl.length-1];
  S.stress=clamp(S.stress+c.s,0,4);
  const bump=Math.max(0,S.stress-1)*8;            // stress hormones push glucose up
  let g=before+Math.round((c.g+bump)*mult);
  if(mult<1) g=Math.round(g+(100-g)*0.3);          // a body without diabetes pulls back toward normal
  g=clamp(g,50,300);
  S.gl.push(g);
  if(c.ok){S.healthy++;S.leaves++;addLeaf()}
  S.log.push({time:m.time,choice:c.t,ok:c.ok,from:before,to:g,bump:Math.round(bump*mult)});

const flu=(k,pad=4,box=64)=>`<svg x="${pad}" y="${pad}" width="${box-pad*2}" height="${box-pad*2}" viewBox="0 0 32 32">${FLUENT[k]}</svg>`;
// swap in Fluent art where the set has the food; foods it lacks keep the custom drawings
Object.assign(ART,{spinach:flu('leafy'),tomato:flu('tomato'),pepper:flu('pepper'),cucumber:flu('cucumber'),carrot:flu('carrot'),broccoli:flu('broccoli'),
  corn:flu('corn'),potato:flu('potato'),eggs:flu('egg'),fried:flu('poultry'),fish:flu('fish'),shrimp:flu('shrimp'),rice:flu('rice'),
  fries:flu('fries'),beans:flu('beans'),tortilla:flu('flatbread'),roll:flu('bread'),juice:flu('juicebox'),soda:flu('cup'),tea:flu('teacup'),horchata:flu('milk')});
const foodSvg=(k,attrs='')=>`<svg viewBox="0 0 64 64" ${attrs} aria-hidden="true">${ART[k]}</svg>`;

let PL=null;
function startPlate(){PL={round:0,score:0,mix:0,results:[],sel:null,msg:'',placed:{veg:[],protein:[],carb:[],drink:[]},done:false}}
const allPlaced=()=>Object.keys(ZONE).every(z=>PL.placed[z].length===ZONE[z].slots);

function plateSvg(){
  const P=PL.placed, sel=PL.sel?FOOD[PL.sel]:null;
  const zone=(z,d,lx,ly)=>{const hot=sel&&ZONE[z]&&PL.placed[z].length<ZONE[z].slots;
    const fill={veg:'#e2f1d8',protein:'#fbe3cf',carb:'#f6f0c8'}[z];
    return `<g class="zone" data-z="${z}" role="button" tabindex="0" aria-label="${ZONE[z].label}, ${ZONE[z].part}. ${P[z].length?'Has '+P[z].map(k=>FOOD[k].n).join(' and '):'Empty'}">
      <path class="zfill" d="${d}" fill="${fill}" stroke="${hot?'var(--ink)':'#fff'}" stroke-width="${hot?3:4}" ${hot?'stroke-dasharray="8 6"':''}/>
      <text x="${lx}" y="${ly}" text-anchor="middle" font-size="15" font-weight="700" fill="var(--ink)">${ZONE[z].label}</text>
      <text x="${lx}" y="${ly+18}" text-anchor="middle" font-size="13" fill="var(--muted)">${ZONE[z].part}</text></g>`};
  const put=(k,x,y)=>k?`<g class="placed" data-k="${k}">${foodSvg(k,`x="${x-34}" y="${y-34}" width="68" height="68"`)}</g>`:'';
  return `<svg class="plate-svg" viewBox="0 0 320 320" font-family="var(--body)" role="group" aria-label="Your plate">
    <circle cx="160" cy="160" r="156" fill="#fff" stroke="var(--line)" stroke-width="2"/>
    ${zone('veg','M160 18 A142 142 0 0 0 160 302 Z',96,166)}
    ${zone('protein','M160 160 L160 18 A142 142 0 0 1 302 160 Z',232,140)}
    ${zone('carb','M160 160 L302 160 A142 142 0 0 1 160 302 Z',232,190)}
    ${put(P.veg[0],96,96)}${put(P.veg[1],96,236)}${put(P.protein[0],226,82)}${put(P.carb[0],226,248)}
  </svg>`;
}

function renderPlate(){
  if(PL.done) return renderPlateSummary();
  if(PL.serve) return renderServe();
  const m=MEALS[PL.round], sel=PL.sel, P=PL.placed;
  const used=new Set(Object.values(P).flat());
  const hotDrink=sel&&FOOD[sel]&&!P.drink.length;
  app.innerHTML=`
  <div style="display:flex;flex-direction:column;gap:8px">
    <button class="link" id="back">← All games</button>
    <div class="row"><span class="tag">${m.name} · ${PL.round+1} of 3</span><span class="tag">${LEAF} ${PL.leaves||0} leaves</span></div>
    <h1 style="font-size:clamp(2rem,8vw,2.8rem)">${m.title}</h1>
    <p class="muted">Fill half your plate with vegetables, a quarter with protein, a quarter with carbs, and pick a drink.</p>
  </div>
  <div class="pgrid">
  <div class="panel plate-wrap">
    ${plateSvg()}
    <button class="drinkbtn ${hotDrink?'hot':''}" id="drink" aria-label="Drink. ${P.drink.length?FOOD[P.drink[0]].n:'Empty glass'}">
      ${P.drink.length?foodSvg(P.drink[0]):foodSvg('water').replace('#bfe1f2','#ffffff')}
      <span><b>Drink</b><br><span class="muted">${P.drink.length?FOOD[P.drink[0]].n:'Empty'}</span></span>
    </button>
    <p class="pmsg" id="pmsg" role="status">${PL.msg||(sel?`Now tap where <b>${FOOD[sel].n}</b> goes.`:'Tap a food below, then tap where it goes. Tap a food on the plate to take it off.')}</p>
    ${allPlaced()?'<button class="btn" id="serve">Serve my plate</button>':''}
  </div>
  <div>
    <h3 style="margin-bottom:10px">Your kitchen</h3>
    <div class="tray">${m.items.map(k=>`<button class="food" data-f="${k}" aria-pressed="${sel===k}" ${used.has(k)?'disabled':''}>${foodSvg(k)}<span>${FOOD[k].n}</span></button>`).join('')}</div>
  </div>
  </div>`;
  app.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{PL.sel=PL.sel===b.dataset.f?null:b.dataset.f;PL.msg='';renderPlate();
    const z=app.querySelector('.plate-wrap'); if(PL.sel&&z&&z.getBoundingClientRect().top<0) z.scrollIntoView({behavior:'smooth',block:'start'});});
  const act=z=>dropOn(z);
  app.querySelectorAll('.zone').forEach(g=>{g.onclick=()=>act(g.dataset.z);g.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();act(g.dataset.z)}}});
  document.getElementById('drink').onclick=()=>act('drink');
  const sv=document.getElementById('serve'); if(sv) sv.onclick=serve;
  document.getElementById('back').onclick=()=>{PL=null;STAGE='hub';render();scrollTo(0,0)};
}

function dropOn(z){
  const P=PL.placed, k=PL.sel;
  if(!k){ // no food picked: tapping a filled spot takes the last item off
    if(P[z].length){const out=P[z].pop();PL.msg=`Took ${FOOD[out].n} off.`}
    else PL.msg='Pick a food from your kitchen first.';
    return renderPlate();
  }
  const f=FOOD[k];
  if(f.cat!==z){PL.mix++;PL.msg=`<span class="bad">Not quite.</span> ${f.miss||`${f.n} is ${CATNAME[f.cat]}. It goes in the ${ZONE[f.cat].label.toLowerCase()} ${f.cat==='drink'?'glass':'section'}.`}`;return renderPlate()}
  if(P[z].length>=ZONE[z].slots){PL.msg=`The ${ZONE[z].label.toLowerCase()} spot is full. Tap it to take something off first.`;return renderPlate()}
  P[z].push(k);PL.sel=null;
  PL.msg=f.q==='sometimes'?`Added ${f.n}. It fits here, but it's a "sometimes" food.`:`<span class="good">Nice.</span> ${f.n} added.`;
  renderPlate();
}

function serve(){
  const P=PL.placed, items=Object.values(P).flat().map(k=>({k,...FOOD[k]}));
  const carb=FOOD[P.carb[0]], drink=FOOD[P.drink[0]], prot=FOOD[P.protein[0]];
  // illustrative 2-hour after-meal estimate (target from Session 2: under 180 mg/dL)
  const after=100+(carb.q==='great'?38:72)+(drink.q==='great'?0:45)+(prot.q==='great'?0:8)-P.veg.length*4;
  const pts=items.reduce((a,i)=>a+(i.q==='great'?25:5),0)+(after<=180?50:0);
  PL.score+=pts;
  const balanced=after<=180&&!items.some(i=>i.swap);
  if(balanced){PL.leaves=(PL.leaves||0)+1;addLeaf()}
  PL.results.push({meal:MEALS[PL.round].name,after,pts,balanced,swaps:items.filter(i=>i.swap),placed:JSON.parse(JSON.stringify(P))});
  PL.serve=true;renderPlate();scrollTo(0,0);
}

function renderServe(){
  const r=PL.results[PL.results.length-1], ok=r.after<=180, clean=!r.swaps.length;
  const mood=!ok?'warn':clean?'cheer':'good';
  const pct=Math.min(100,Math.max(0,(r.after-60)/(260-60)*100)), tgt=(180-60)/(260-60)*100;
  app.innerHTML=`
  <div style="display:flex;flex-direction:column;gap:8px">
    <span class="tag" style="align-self:flex-start">${r.meal} served${r.balanced?' · +1 leaf':''}</span>
    <h1 style="font-size:clamp(2rem,8vw,2.8rem)">${clean&&ok?'A balanced plate.':ok?'Good plate, with room to swap.':'This plate spikes your blood sugar.'}</h1>
  </div>
  <div class="panel" style="align-items:center;text-align:center">
    <div class="buddy">${sprout(mood)}<span class="say">${SPROUT_SAYS[mood==='cheer'?'cheer':mood==='warn'?'warn':'good']}</span></div>
    <div style="width:100%;display:flex;flex-direction:column;gap:8px;text-align:left">
      <div class="row" style="justify-content:space-between"><b>2 hours after eating</b><span class="tag ${ok?'good':'warn'}">${r.after} mg/dL · ${ok?'In target':'Running high'}</span></div>
      <div class="meter" role="img" aria-label="Blood sugar ${r.after}, target is under 180"><span class="meter-fill ${ok?'':'hi'}" style="width:${pct}%"></span><span class="meter-tgt" style="left:${tgt}%"></span></div>
      <div class="row fine" style="justify-content:space-between"><span>Before eating: about 100</span><span>Target: under 180</span></div>
    </div>
  </div>
  ${r.swaps.length?`<div class="panel"><h3>Try these swaps next time</h3><ul class="swaps">${r.swaps.map(s=>`<li>${foodSvg(s.k)}<div><span class="muted">Instead of ${s.n.toLowerCase()}</span><b>${s.swap}</b></div></li>`).join('')}</ul></div>`
    :`<div class="panel"><h3>Why it works</h3><p>Half the plate is vegetables, so fiber slows the rise. Protein keeps you full, and water adds no sugar.</p></div>`}
  <p class="fine">Numbers are illustrative for learning, not medical guidance.</p>
  <button class="btn" id="next">${PL.round<2?`Next: ${MEALS[PL.round+1].name}`:'See my results'}</button>`;
  document.getElementById('next').onclick=()=>{PL.serve=false;PL.round++;PL.placed={veg:[],protein:[],carb:[],drink:[]};PL.sel=null;PL.msg='';
    if(PL.round>=MEALS.length) PL.done=true; renderPlate();scrollTo(0,0)};
}

      <circle cx="-8" cy="2" r="2.6" fill="var(--ink)"/><circle cx="8" cy="2" r="2.6" fill="var(--ink)"/>
      <path d="${mouth}" stroke="var(--ink)" stroke-width="2.6" fill="none" stroke-linecap="round"/></g>
    <rect x="-26" y="40" width="52" height="22" rx="11" fill="var(--ink)"/><text x="0" y="55" text-anchor="middle" font-size="12" font-weight="700" fill="#fff" font-family="var(--body)">Rosa</text></g>`;
}
const disc=(x,y,r,c='#fff')=>`<circle cx="${x}" cy="${y}" r="${r}" fill="${c}"/>`;
const placeIcon=(svg,x,y,size)=>svg.replace('<svg ',`<svg x="${x-size/2}" y="${y-size/2}" width="${size}" height="${size}" `);
const paws=(pts)=>pts.map(([x,y,r])=>`<g transform="translate(${x} ${y}) rotate(${r})" fill="#d9a066"><ellipse cx="0" cy="4" rx="7" ry="6"/><circle cx="-7" cy="-5" r="3"/><circle cx="0" cy="-8" r="3"/><circle cx="7" cy="-5" r="3"/></g>`).join('');
function storyScene(sc,val){
  let bg='#eef2f8', mid='', mood='ok';
  if(sc==='walk'){bg='#e3eefb';mid=`${disc(380,130,92)}${placeIcon(aicon('shoe'),380,130,110)}${paws([[520,200,20],[556,170,30],[586,136,20]])}${disc(560,52,22,'#f7d77a')}`;}
  else if(sc==='shaky'){bg='#fbeef1';mood='worry';mid=['shaky','sweat','dizzy'].map((k,i)=>`${disc(270+i*120,130,50)}${placeIcon(r15icon(k),270+i*120,130,64)}`).join('');}
  else if(sc==='stop'){bg='#fbeef1';mood='worry';mid=`${disc(380,130,92)}${placeIcon(r15icon('meter'),380,124,100)}<text x="456" y="80" font-size="44" font-weight="700" fill="var(--trust)" font-family="var(--display)">?</text>`;}
  else if(sc==='meter'){
    const c=val==null?'#e6f0f7':val<70?'#f8d9df':'#ddf1e6', t=val==null?'var(--ink)':val<70?'var(--low)':'var(--leaf)';
    mood=val!=null&&val<70?'worry':'ok'; bg=val!=null&&val<70?'#fbeef1':val!=null?'#e8f5ee':'#eef2f8';
    mid=`${disc(380,130,106)}<rect x="328" y="42" width="104" height="176" rx="28" fill="var(--ink)"/><rect x="342" y="60" width="76" height="72" rx="14" fill="${c}"/>
      <text x="380" y="106" text-anchor="middle" font-size="34" font-weight="700" fill="${t}" font-family="var(--display)">${val??'– –'}</text>
      <text x="380" y="124" text-anchor="middle" font-size="11" font-weight="600" fill="var(--muted)" font-family="var(--body)">mg/dL</text><circle cx="380" cy="176" r="18" fill="#fff"/>`;}
  else if(sc==='bag'){bg='#f7f1e6';mood='worry';mid=`<rect x="226" y="96" width="320" height="136" rx="30" fill="${BAG}"/><path d="M306 100 C306 50 466 50 466 100" stroke="#a8814f" stroke-width="12" fill="none" stroke-linecap="round"/>
      ${['chocolate','juice','peanuts','diet'].map((k,i)=>`${disc(268+i*78,160+(i%2?-8:8),34)}${placeIcon(sicon(k),268+i*78,160+(i%2?-8:8),44)}`).join('')}`;}
  else if(sc==='bench'){bg='#e3eefb';mid=`${disc(380,126,92)}<circle cx="380" cy="126" r="64" fill="none" stroke="var(--ink)" stroke-width="7"/><path d="M380 126 V86 M380 126 L408 142" stroke="var(--ink)" stroke-width="7" stroke-linecap="round"/><rect x="336" y="222" width="88" height="28" rx="14" fill="var(--trust)"/><text x="380" y="241" text-anchor="middle" font-size="15" font-weight="700" fill="#fff" font-family="var(--body)">15 min</text>`;}
  else if(sc==='tablets'){bg='#e3eefb';mid=`${disc(380,130,92)}${placeIcon(r15icon('tablets'),380,130,120)}`;}
  else if(sc==='snack'){bg='#e8f5ee';mid=`${disc(380,130,92)}${placeIcon(r15icon('crackers'),380,130,120)}`;}
  else if(sc==='home'){bg='#fdf3d6';mid=`${disc(380,130,96)}<rect x="330" y="118" width="100" height="74" rx="8" fill="#fff" stroke="var(--ink)" stroke-width="4"/><path d="M314 124 L380 72 L446 124Z" fill="var(--trust)"/><rect x="368" y="146" width="24" height="46" rx="4" fill="${CARDI}"/>${paws([[500,214,-10],[532,190,0]])}${disc(560,52,22,'#f6c85a')}`;}
  return `<svg viewBox="0 0 640 260" role="img" aria-label="Story picture" font-family="var(--body)"><rect width="640" height="260" fill="${bg}"/>${mid}${rosaBadge(100,150,mood)}</svg>`;
}

// ---- game state & screens ----
let RF=null;
function startR15(){RF={i:0,g:null,shown:null,score:0,points:0,ans:null,checked:false,timer:'idle'}}
const r15stage=()=>RF.i>=STORY.length?'done':'play';
function r15side(){
  const g=RF.g, from=RF.shown??g; RF.shown=g;
  const justRight=RF.ans!=null&&STORY[RF.i]?.opts?.[RF.ans]?.ok;
  const mood=justRight?'cheer':g==null?(RF.i>=1?'stress':'good'):g<LO?'bad':RF.i>=STORY.length-1?'cheer':'good';
  const say=justRight?'Sprout loves that answer!':g==null?(RF.i>=1?'Sprout is worried about Rosa':'Sprout is following along'):g<LO?'Rosa is low':'Rosa is back to steady';
  const pct=Math.round(RF.i/STORY.length*100);
  return `<div class="buddy-hero">${sprout(mood)}<span class="say">${say}</span></div>
  <div class="panel hudp">
    <div class="hp-head"><span>Rosa's blood sugar</span><span class="hp-now">${g==null?'Not checked yet':'Last check'}</span></div>
    ${g==null?`<div class="r-unk">?? <small>mg/dL</small></div>`:gauge(g,from)}
    <div class="hp-sec"><span class="hp-label">Story progress</span><div class="s-prog" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><span style="width:${pct}%"></span></div></div>
    <div class="hp-two"><div><span class="hp-label">Quiz score</span><div class="hp-val"><b class="big">${RF.score}</b><span class="muted">of ${QUIZ_TOTAL}</span></div></div><div><span class="hp-label">Leaves</span><div class="hp-val">${LEAF}<b class="big">${RF.score}</b></div></div></div>
  </div>`;
}
function r15main(){
  const b=STORY[RF.i], chap=`<span class="tag r-steptag">${b.ch}</span>`;
  const pic=`<div class="s-scene">${storyScene(b.scene,b.type==='check'&&!RF.checked?null:b.value)}</div>`;
  if(b.type==='story') return `<div class="panel fade s-card">${chap}${pic}<p class="s-text">${b.text}</p><button class="btn" id="next">${b.btn}</button></div>`;
  if(b.type==='check'){
    const ok=b.value>=LO, msg=RF.checked?(b.value<LO?`${b.value} is under 70.`:`${b.value} is above 70.`):'';
    return `<div class="panel fade s-card">${chap}${pic}<p class="s-text">${b.text}</p>
      ${RF.checked?`<p class="r-msg ${ok?'ok':'low'}">${msg}</p><button class="btn" id="next">Continue the story</button>`
        :`${rDo('Tap <b>Check</b> to see Rosa\'s number.')}<button class="btn doCheck" id="doCheck">Check</button>`}</div>`;
  }
  if(b.type==='wait') return `<div class="panel fade s-card">${chap}${pic}<p class="s-text">${b.text}</p>
      <div class="s-wait"><div class="r-timer"><svg viewBox="0 0 120 120" aria-hidden="true"><circle cx="60" cy="60" r="52" fill="none" stroke="var(--line)" stroke-width="10"/><circle id="rring" cx="60" cy="60" r="52" fill="none" stroke="var(--trust)" stroke-width="10" stroke-linecap="round" pathLength="100" stroke-dasharray="100" stroke-dashoffset="${RF.timer==='done'?100:0}" transform="rotate(-90 60 60)"/></svg><span id="rclock">${RF.timer==='done'?'0:00':'15:00'}</span></div>
      <div class="s-waitside">${RF.timer==='idle'?rDo('Tap <b>Start the timer</b>. We will speed up the 15 minutes.')+'<button class="btn" id="startWait">Start the timer</button>':RF.timer==='run'?'<p class="muted" role="status">Waiting 15 minutes…</p>':'<p class="r-msg ok">15 minutes have passed.</p><button class="btn" id="next">Continue the story</button>'}</div></div></div>`;
  // quiz
  const a=RF.ans, answered=a!=null, right=answered&&b.opts[a].ok;
  return `<div class="panel fade s-card">${chap}${pic}<p class="s-text">${b.text}</p>
    <div class="s-q"><span class="s-qlabel">Quiz</span><h2>${b.q}</h2></div>
    ${answered?'':rDo('Tap <b>one</b> answer.')}
    <div class="choices grid4">${b.opts.map((o,k)=>{const st=!answered?'':o.ok?'right':k===a?'wrong':'dim';
      return `<button class="choice r-tile s-opt ${st}" data-a="${k}" ${answered?'disabled':''}><span class="ans-top">${o.ic?`<span class="ans-ic">${sicon(o.ic)}</span>`:`<span class="s-letter">${'ABCD'[k]}</span>`}${answered&&(o.ok||k===a)?`<span class="s-mark">${o.ok?'✓':'✕'}</span>`:''}</span><span>${o.t}</span></button>`}).join('')}</div>
    ${answered?`<p class="r-msg ${right?'ok':'low'}">${right?'Correct. ':'Not quite. '}${b.opts[a].ok?b.opts[a].fb:b.opts[a].fb+' '+b.opts.find(o=>o.ok).fb}</p><button class="btn" id="next">Continue the story</button>`:''}
  </div>`;
}
function renderR15(){
  if(r15stage()==='done') return renderR15Done();
  app.innerHTML=`<button class="link" id="quit">← All games</button><div class="gwrap story"><div class="gside">${r15side()}</div><div class="gmain">${r15main()}</div></div>`;
  if(RF.fadeFor===RF.i) app.querySelectorAll('.gmain .fade').forEach(e=>e.classList.remove('fade'));
  RF.fadeFor=RF.i;
  const mood=app.querySelector('.buddy-hero svg')?.getAttribute('aria-label');
  if(mood===RF.lastMood) app.querySelector('.buddy-hero svg').style.animation='none';
  RF.lastMood=mood;
  const $=id=>document.getElementById(id), b=STORY[RF.i];
  $('quit').onclick=()=>{RF=null;STAGE='hub';render();scrollTo(0,0)};
  app.querySelectorAll('[data-a]').forEach(btn=>btn.onclick=()=>{RF.ans=+btn.dataset.a;if(b.opts[RF.ans].ok){RF.score++;addLeaf()}renderR15()});
  if($('doCheck')) $('doCheck').onclick=()=>{const btn=$('doCheck');btn.disabled=true;btn.textContent='Checking…';
    heroTimers.push(setTimeout(()=>{RF.checked=true;RF.g=b.value;renderR15();animGauge()},700))};
  if($('startWait')) $('startWait').onclick=()=>{RF.timer='run';renderR15();
    const ring=$('rring'),clock=$('rclock'),dur=matchMedia('(prefers-reduced-motion: reduce)').matches?10:3500,t0=performance.now();
    const tick=now=>{const f=Math.min(1,(now-t0)/dur);if(!document.body.contains(ring))return;
      ring.setAttribute('stroke-dashoffset',(f*100).toFixed(1));const left=Math.ceil(900*(1-f));clock.textContent=`${Math.floor(left/60)}:${String(left%60).padStart(2,'0')}`;
      if(f<1)requestAnimationFrame(tick);else{RF.timer='done';renderR15()}};requestAnimationFrame(tick)};
  if($('next')) $('next').onclick=()=>{RF.i++;RF.ans=null;RF.checked=false;RF.timer='idle';renderR15();animGauge();scrollTo({top:0,behavior:'smooth'})};
  const n=$('next'); if(n) n.focus({preventScroll:true});
}

// =================== LEAVES & SHARED GARDEN ===================
// Healthy choices, balanced plates, and correct answers each earn a leaf.
// Leaves add up across all games and are saved only in this browser (no accounts, nothing sent anywhere).
const LEAF=`<svg class="leaf-ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20 C4 9 11 4 21 3 C21 13 15 20 4 20Z" fill="#5ea63a"/><path d="M5 19 C9 15 13 11 19 5" stroke="#cfeebd" stroke-width="1.8" fill="none" stroke-linecap="round"/></svg>`;
function getLeaves(){try{return +(localStorage.getItem('sd_leaves')||0)}catch(e){return window.__leaves||0}}
function setLeaves(n){window.__leaves=n;try{localStorage.setItem('sd_leaves',n)}catch(e){}}
function addLeaf(){
  setLeaves(getLeaves()+1);
  const pop=document.createElement('div');
  pop.className='leaf-pop';pop.setAttribute('role','status');
  pop.innerHTML=`${LEAF}<span>+1 leaf</span>`;
  document.body.appendChild(pop);
  setTimeout(()=>pop.remove(),1600);
}
// garden: every 3 leaves grows one plant through 4 stages (seed, sprout, leafy, flowering)
function gardenGrow(n){
  const slots=12, plants=[];
  for(let i=0;i<slots;i++) plants.push(Math.max(0,Math.min(3,n-i*3)));
  const kinds=[(x,y,s)=>lettuce(x,y,s),(x,y,s)=>flower(x,y,'var(--coral)',30,s),(x,y,s)=>carrot(x,y,s),(x,y,s)=>flower(x,y,'#8e9fe8',26,s)];
  const draw=plants.map((st,i)=>{const x=40+i*(560/(slots-1)), y=100;
    if(st===0) return `<ellipse cx="${x}" cy="${y-2}" rx="9" ry="3.5" fill="#b89470" opacity=".5"/>`;
    if(st===1) return seedling(x,y,1.1);
    if(st===2) return seedling(x,y,1.6);
    return kinds[i%4](x,y,1.25);
  }).join('');
  return `<svg viewBox="0 0 640 124" role="img" aria-label="Your garden with ${n} leaves" font-family="var(--body)">
    <rect width="640" height="124" fill="#e3eefb"/>${sunIllo(604,26,11)}
    <path d="M0 84 C160 72 480 72 640 84 V124 H0Z" fill="#c3e5a8"/>
    <rect x="12" y="96" width="616" height="18" rx="9" fill="var(--soil)"/>${draw}</svg>`;
}
function gardenPanel(){
  const n=getLeaves(), next=3-(n%3), full=n>=36;
  return `<div class="panel garden-panel">
    <div class="gp-head"><div><h3>Your garden</h3><p class="muted">${n?`Every leaf you earn helps it grow.${full?' Your garden is in full bloom!':` ${next} more ${next>1?'leaves':'leaf'} to grow your next plant.`}`:'Make healthy choices in any game to earn leaves and grow your garden.'}</p></div>
      <span class="gp-count">${LEAF}<b>${n}</b><span>leaves</span></span></div>
    <div class="gp-art">${gardenGrow(n)}</div></div>`;
}

// ---------- Simple, encouraging results (shared look for all three games) ----------
// tone: celebrate what went well; if things went poorly, invite a replay without blame
function resHero({game,mood,title,msg,stats}){
  return `<div class="res-hero fade">${sprout(mood)}
    <span class="tag">${game} · Done</span>
    <h1>${title}</h1>${msg?`<p class="lead">${msg}</p>`:''}
    <div class="res-stats">${stats.map(s=>`<span>${s}</span>`).join('')}</div></div>`;
}
const resTry=(t)=>`<div class="panel res-try"><h3>One thing to try next time</h3><p>${t}</p></div>`;

function renderSummary(){
  const h=S.healthy, great=h>=5, okish=h>=3;
  const worst=S.log.filter(e=>!e.ok).sort((a,b)=>(b.to-b.from)-(a.to-a.from))[0];
  const better=worst?MOMENTS.find(m=>m.time===worst.time).choices.find(c=>c.ok).t:'';
  const goalOpts=Object.keys(BIG_GOALS).map(g=>`<option>${g}</option>`).join('');
  app.innerHTML=`<div class="res">
  ${resHero({game:'A stressful day',mood:great?'cheer':okish?'good':'good',
    title:great?'You kept Sprout steady.':okish?'Nice work today.':'That was a tough day.',
    msg:great?''
      :okish?'You made some healthy choices. A few different picks could make the day even steadier. Want to try again?'
      :'Hard days happen, and every replay is a fresh start. Try the day again and see how different choices change your blood sugar.',
    stats:[`${LEAF}<b>${S.leaves}</b> ${S.leaves===1?'leaf':'leaves'} earned`,`<b>${h} of 6</b> healthy choices`]})}
  <div class="panel"><span class="hp-label">Your day</span>${dayTrack(S.gl,true)}</div>
  ${worst?resTry(`At ${worst.time}, instead of “${esc(worst.choice.toLowerCase())},” try “${esc(better.toLowerCase())}.”`):''}
  <details class="panel res-more"><summary>Set a small goal for this week</summary>
    <div class="form">
      <div class="full"><label for="big">Big goal</label><select id="big">${goalOpts}</select></div>
      <div class="full"><label for="act">Small step: I will…</label><input id="act" value="${BIG_GOALS['Be more physically active']}"></div>
      <div><label for="days">How often</label><select id="days"><option>Monday through Friday</option><option>3 days a week</option><option>every day</option><option>on weekends</option></select></div>
      <div><label for="mins">Minutes</label><input id="mins" type="number" min="1" max="120" value="30"></div>
      <div class="full"><label for="wks">For how long</label><select id="wks"><option>the next week</option><option selected>the next 2 weeks</option><option>the next month</option></select></div>
    </div>
    <p class="goal" id="goal"></p>
    <div class="row"><button class="btn ghost" id="copy">Copy goal</button><span class="fine" id="copied"></span></div>
  </details>
  <p class="fine res-help">Feeling overwhelmed in real life? Talk to your healthcare provider. In a crisis in the US, call or text 988.</p>
  <div class="row res-btns"><button class="btn" id="again">${great?'Play again':'Try the day again'}</button><button class="btn ghost" id="tohub">All games</button></div>
  </div>`;
  const upd=()=>{const a=document.getElementById('act').value.trim()||'…';
    document.getElementById('goal').textContent=`“I will ${a} ${document.getElementById('days').value} for ${document.getElementById('mins').value} minutes, for ${document.getElementById('wks').value}.”`};
  document.getElementById('big').onchange=e=>{document.getElementById('act').value=BIG_GOALS[e.target.value];upd()};
  ['act','days','mins','wks'].forEach(id=>document.getElementById(id).oninput=upd);
  upd();
  document.getElementById('copy').onclick=()=>{const t=document.getElementById('goal').textContent,m=document.getElementById('copied');
    navigator.clipboard.writeText(t).then(()=>m.textContent='Copied',()=>{const r=document.createRange();r.selectNodeContents(document.getElementById('goal'));const s=getSelection();s.removeAllRanges();s.addRange(r);m.textContent='Selected, press copy'})};
  document.getElementById('again').onclick=()=>{reset(S.path);render();scrollTo(0,0)};
  document.getElementById('tohub').onclick=()=>{S=null;STAGE='hub';render();scrollTo(0,0)};
}

function renderPlateSummary(){
  const b=PL.results.filter(r=>r.balanced).length, swap=PL.results.flatMap(r=>r.swaps)[0];
  app.innerHTML=`<div class="res">
  ${resHero({game:'Build a plate',mood:b===3?'cheer':'good',
    title:b===3?'Three balanced plates.':b>0?`${b} of 3 plates balanced.`:'Plates take practice.',
    msg:b===3?'Half vegetables, a little protein and carbs, and water. You have the plate method down.'
      :b>0?'Good start. A couple of swaps and every plate could be balanced. Want to try again?'
      :'Building a plate is a skill, and the swaps below make it easier. Give it another go.',
    stats:[`${LEAF}<b>${PL.leaves||0}</b> ${PL.leaves===1?'leaf':'leaves'} earned`,`<b>${b} of 3</b> balanced plates`]})}
  <div class="panel"><span class="hp-label">Your meals</span>
    <ul class="res-meals">${PL.results.map(r=>`<li><span class="res-dot ${r.balanced?'good':'warn'}">${r.balanced?'✓':'↻'}</span><div><b>${r.meal}</b><span class="muted">${r.balanced?'Balanced':'Could use a swap'} · ${r.after} mg/dL after</span></div></li>`).join('')}</ul></div>
  ${swap?resTry(`Instead of ${swap.n.toLowerCase()}, try ${swap.swap.charAt(0).toLowerCase()+swap.swap.slice(1)}.`):''}
  <details class="panel res-more"><summary>Portion tips from the workshop</summary>
    <ul class="hands"><li><b>Palm</b><span>3 oz of meat, fish, or chicken</span></li><li><b>Fist</b><span>8 fl oz, about 1 cup</span></li><li><b>Cupped hand</b><span>1 serving of fruit</span></li><li><b>Fingertip</b><span>1 tbsp of peanut butter or dressing</span></li></ul>
    <ul class="tips"><li>Use a smaller plate, about 8 to 9 inches.</li><li>Start with your vegetables.</li><li>Have a glass of water with each meal.</li></ul>
  </details>
  <div class="row res-btns"><button class="btn" id="again">${b===3?'Play again':'Try again'}</button><button class="btn ghost" id="hub">All games</button></div>
  </div>`;
  document.getElementById('again').onclick=()=>{startPlate();renderPlate();scrollTo(0,0)};
  document.getElementById('hub').onclick=()=>{PL=null;STAGE='hub';render();scrollTo(0,0)};
}

function renderR15Done(){
  const x=RF.score, all=x===QUIZ_TOTAL, most=x>=5;
  app.innerHTML=`<div class="res">
  ${resHero({game:'Rule of 15',mood:all?'cheer':'good',
    title:all?'You helped Rosa perfectly.':'Rosa made it home safe.',
    msg:all?'You answered every question right. You know the Rule of 15.'
      :most?'You helped Rosa through her low. Read the story again to try the questions you missed.'
      :'Rosa is okay, and now you know the steps. Read the story again and see how many more you get right.',
    stats:[`${LEAF}<b>${x}</b> ${x===1?'leaf':'leaves'} earned`,`<b>${x} of ${QUIZ_TOTAL}</b> questions right`]})}
  <div class="panel"><h3>The Rule of 15</h3>
    <ol class="r-recap">${R15_STEPS.map((t,k)=>`<li><span class="ans-ic">${r15icon(['meter','juice','timer','snack'][k])}</span><span>${t}</span></li>`).join('')}</ol>
    <p class="fine">Still under 70 after 15 minutes? Repeat steps 2 and 3.</p></div>
  <details class="panel res-more"><summary>What counts as 15 grams?</summary>
    <ul class="hands" style="grid-template-columns:1fr 1fr"><li><b>4 oz</b><span>regular juice or soda</span></li><li><b>3 to 4</b><span>glucose tablets</span></li><li><b>1 tbsp</b><span>honey</span></li><li><b>3 packets</b><span>sugar</span></li></ul>
  </details>
  <p class="fine res-help">Draft content for clinical review. Always follow your care team's plan.</p>
  <div class="row res-btns"><button class="btn" id="again">${all?'Read again':'Read the story again'}</button><button class="btn ghost" id="hub">All games</button></div>
  </div>`;
  document.getElementById('again').onclick=()=>{startR15();renderR15();scrollTo(0,0)};
  document.getElementById('hub').onclick=()=>{RF=null;STAGE='hub';render();scrollTo(0,0)};
}

function render(){
  stopHero();
  if(PL) return renderPlate();
  if(RF) return renderR15();
  if(!S) return STAGE==='intro'?renderIntro():STAGE==='hub'?renderHub():renderStart();
  if(S.i>=MOMENTS.length) return renderSummary();
  const m=MOMENTS[S.i];
  m.quiz?renderQuiz(m):renderMoment(m);
  animGauge();
  const q=document.getElementById('quit');
  if(q) q.onclick=()=>{S=null;STAGE='hub';render();scrollTo(0,0)};
}
render();
</script>
